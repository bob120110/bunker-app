<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bunker Atlas</title>
  <meta name="description" content="Atlante mondiale aperto di bunker, rifugi e fortificazioni storiche.">
  <meta name="theme-color" content="#1c2833">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bunker Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="toggle-sidebar" class="icon-btn" aria-controls="sidebar" aria-expanded="true" title="Filtri">☰</button>
    <h1>Bunker Atlas</h1>
    <input id="search" type="search" placeholder="Cerca per nome o località…" autocomplete="off" aria-label="Cerca">
    <button id="install-app" class="install-btn" hidden>Installa</button>
  </header>
  <div id="offline-banner" class="offline-banner" hidden>Sei offline: dati e zone della mappa già visitate restano disponibili.</div>
  <div id="ios-install-hint" class="ios-hint" hidden>
    Per installare l'app: tocca <strong>Condividi</strong> e poi <strong>Aggiungi alla schermata Home</strong>.
    <button type="button" class="icon-btn" id="ios-hint-close" title="Chiudi">✕</button>
  </div>

  <main class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Filtri e risultati">
      <section>
        <h2>Tipologia</h2>
        <div id="filter-category" class="checks"></div>
      </section>
      <section class="row">
        <label>Periodo
          <select id="filter-period"><option value="">Tutti</option></select>
        </label>
        <label>Stato
          <select id="filter-status"><option value="">Tutti</option></select>
        </label>
      </section>
      <section>
        <div class="results-head">
          <h2><span id="result-count">0</span> strutture</h2>
          <button id="fit-results" class="link-btn">Inquadra</button>
        </div>
        <p id="results-note" class="note"></p>
        <ul id="results" class="results"></ul>
      </section>
    </aside>

    <div id="map" class="map" role="region" aria-label="Mappa"></div>

    <aside id="detail" class="detail" hidden aria-live="polite">
      <button id="close-detail" class="icon-btn close" title="Chiudi">✕</button>
      <div id="detail-body"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
